services:
  app:
    container_name: graphql_server
    build: .
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      COGNITO_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_amaiback
      COGNITO_CLIENT_ID: amaiback-local-client
      COGNITO_CLIENT_SECRET: ""
      COGNITO_ENDPOINT: http://floci:4566
      COGNITO_ISSUER: http://floci:4566/us-east-1_amaiback
      COGNITO_JWKS_URI: http://floci:4566/us-east-1_amaiback/.well-known/jwks.json
    depends_on:
      db:
        condition: service_started
      floci:
        condition: service_healthy

  floci:
    container_name: floci_aws
    image: floci/floci:latest-compat
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localhost:4566
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_COGNITO_ENABLED: "true"
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci_data:/app/data
      - ./docker/floci/init-aws.sh:/etc/floci/init/ready.d/01-init-aws.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "aws cognito-idp describe-user-pool --user-pool-id us-east-1_amaiback --endpoint-url http://localhost:4566 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db:
    container_name: postgres_db
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db

volumes:
  postgres_data:
  floci_data:
